{% set name = "batsim" %}
{% set version = "0.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../..

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  # skip: true  # [not linux]  # uncomment if you want linux-only builds

requirements:
  build: []
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools
    - wheel
    - pybind11 >=3,<4
    - eigen
    - numpy >=1.26,<2.0
    - galsim
    - fitsio
  run:
    - python >=3.10,<3.13
    - numpy >=1.26,<2.0
    - galsim
    - fitsio
    - matplotlib >=3.8,<3.9
    - astropy >=6.0,<6.1

test:
  imports:
    - batsim
    - batsim._gsinterface

about:
  license: MIT
  summary: "BATSim package with GalSim C++ sampling and optional CuPy GPU support"
